# Hardened CI workflow for totaldrop-ios-tvos (ADR 0009, ADR 0019, ADR 0020):
# pinned macos-15 + Linux multi-arch Rust FFI/bridge checks, deterministic
# opaque RGB Kose icons, 3-way C header & version parity, real iOS device +
# universal simulator XCFramework assembly & native symbol checks, live Swift 6
# iOS Simulator FFI tests, tvOS SDK compilation, cargo-deny, REUSE 3.3, and gitleaks.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust-bridge:
    name: Rust Bridge & FFI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        env:
          TOTALDROP_REQUIRE_IPV6: "1"
        run: cargo test --workspace --locked

  static-checks:
    name: Static assets, versions & subplatforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify iOS/tvOS versions, 3-way C header & ADR 0009 runner parity
        run: python3 tools/check-versions.py
      - name: Verify deterministic opaque RGB Kose iOS & tvOS icons
        run: python3 tools/render-apple-mobile-assets.py --check
      - name: Self-test XCFramework verifier
        run: python3 tools/verify-xcframework.py --self-test
      - name: Verify 35-locale Localizable.xcstrings parity (iOS & tvOS)
        run: >-
          python3 -c 'import json;
          assert len(json.load(open("ui-swiftui-ios/Resources/Localizable.xcstrings"))["strings"]["verificationTitle"]["localizations"]) == 35;
          assert len(json.load(open("ui-swiftui-tvos/Resources/Localizable.xcstrings"))["strings"]["verificationTitle"]["localizations"]) == 35'
      - name: Validate packaging shell script syntax & 6 subplatform units
        run: |
          for script in target-*/*.sh; do
            bash -n "$script"
          done
          python3 tools/verify-subplatforms.py

  apple-mobile-macos15:
    name: Apple Mobile Rust Tests, XCFramework & Swift 6 Simulator CI (macos-15)
    runs-on: macos-15
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "18.0"
      TVOS_DEPLOYMENT_TARGET: "18.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and iOS targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          xcodebuild -version
          xcodebuild -showsdks
      - name: Clippy & Workspace Tests on macOS 15
        env:
          TOTALDROP_REQUIRE_IPV6: "1"
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Build Rust C ABI FFI staticlib (iOS device arm64)
        run: cargo build --release --locked -p totaldrop-apple-mobile-ffi --target aarch64-apple-ios
      - name: Build Rust C ABI FFI staticlib (iOS Simulator arm64)
        run: cargo build --release --locked -p totaldrop-apple-mobile-ffi --target aarch64-apple-ios-sim
      - name: Build Rust C ABI FFI staticlib (iOS Simulator x86_64)
        run: cargo build --release --locked -p totaldrop-apple-mobile-ffi --target x86_64-apple-ios
      - name: Assemble & natively verify TotalDropAppleMobileFFI.xcframework
        run: |
          ./target-tvos-arm64/build-xcframework.sh --ios-only --skip-build
          python3 tools/verify-xcframework.py \
            --xcframework dist/TotalDropAppleMobileFFI.xcframework \
            --check-native
      - name: Build Swift 6 iOS Device (TotalDropIOS + ShareExtension) & tvOS Simulator (TotalDropTV)
        run: |
          ROOT_DIR="$PWD"
          (
            cd "${ROOT_DIR}/ui-swiftui-ios"
            xcodebuild -list
            xcodebuild build \
              -scheme TotalDropIOS \
              -destination "generic/platform=iOS" \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO \
              OTHER_LDFLAGS="\$(inherited) -L${ROOT_DIR}/target/aarch64-apple-ios/release -ltotaldrop_apple_mobile_ffi"
            xcodebuild build \
              -scheme ShareExtension \
              -destination "generic/platform=iOS" \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO
          )
          if xcrun --sdk appletvsimulator --show-sdk-path >/dev/null 2>&1; then
            (
              cd "${ROOT_DIR}/ui-swiftui-tvos"
              xcodebuild -list
              xcodebuild build \
                -scheme TotalDropTV \
                -destination "generic/platform=tvOS Simulator" \
                -configuration Release \
                CODE_SIGNING_ALLOWED=NO
            )
          else
            echo "::warning::appletvsimulator SDK not installed on this runner image; skipping TotalDropTV SDK compile"
          fi
      - name: Run live Swift 6 + Rust FFI tests on iPhone Simulator
        run: |
          ROOT_DIR="$PWD"
          HOST_ARCH="$(uname -m)"
          if [ "$HOST_ARCH" = "arm64" ]; then
            SIM_RUST_TARGET="aarch64-apple-ios-sim"
          else
            SIM_RUST_TARGET="x86_64-apple-ios"
          fi
          SIM_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in sorted(data.get("devices", {}).items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for dev in devices:
                  if dev.get("isAvailable") and "iPhone" in dev.get("name", ""):
                      print(dev["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')"
          echo "Using available iPhone Simulator UDID: ${SIM_UDID} (Rust target: ${SIM_RUST_TARGET})"
          (
            cd "${ROOT_DIR}/ui-swiftui-ios"
            TEST_SCHEME="TotalDropIOS"
            if xcodebuild -list | grep -qx '[[:space:]]*TotalDropIOS-Package'; then
              TEST_SCHEME="TotalDropIOS-Package"
            fi
            echo "Running Swift 6 + live Rust FFI tests via scheme: ${TEST_SCHEME}"
            xcodebuild test \
              -scheme "${TEST_SCHEME}" \
              -only-testing:TotalDropIOSTests \
              -destination "platform=iOS Simulator,id=${SIM_UDID}" \
              CODE_SIGNING_ALLOWED=NO \
              OTHER_LDFLAGS="\$(inherited) -L${ROOT_DIR}/target/${SIM_RUST_TARGET}/release -ltotaldrop_apple_mobile_ffi -framework Security -framework SystemConfiguration -framework CoreFoundation"
          )

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.99.1"

  reuse:
    name: Licenses (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source files carry SPDX lines
        run: ./tools/check-spdx.sh
      - name: reuse lint
        run: >-
          docker run --rm --volume "$PWD:/data"
          fsfe/reuse:6.2.0@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e
          lint

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case $EVENT in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE ;;
            merge_group) base=$MERGE_GROUP_BASE ;;
            *) base= ;;
          esac
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            range=$base..HEAD
          else
            base=HEAD range=HEAD
          fi
          echo "Scanning $range"
          { echo "BASE=$base"; echo "RANGE=$range"; } >>"$GITHUB_ENV"
      - name: No signing keys, key.properties or .gitleaksignore
        run: |
          found=$(
            { git ls-files -z
              git -c core.quotePath=false log --format= --name-only -z --no-renames --diff-filter=d "$RANGE"
            } | grep -ziE '(^|/)(key\.properties|\.gitleaksignore)$|\.(jks|keystore|p12|pfx|pepk)$' | tr '\0' '\n' | sort -u
          )
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::Signing keys, key.properties, and .gitleaksignore must never be committed."
            exit 1
          fi
      - name: gitleaks
        if: ${{ !cancelled() && steps.range.outcome == 'success' }}
        run: |
          cfg=$RUNNER_TEMP/gitleaks
          mkdir -p "$cfg"
          if ! git show "$BASE:.gitleaks.toml" >"$cfg/gitleaks.toml" 2>/dev/null; then
            printf '[extend]\nuseDefault = true\n' >"$cfg/gitleaks.toml"
          fi
          docker run --rm --volume "$PWD/.git:/repo/.git:ro" --volume "$cfg:/cfg:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git --no-banner --redact --verbose --config /cfg/gitleaks.toml \
            --gitleaks-ignore-path /cfg --ignore-gitleaks-allow \
            --log-opts="--text $RANGE" /repo

  gate:
    name: CI
    if: always()
    needs: [rust-bridge, static-checks, apple-mobile-macos15, deny, reuse, secrets]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
